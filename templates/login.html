<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PUP Lopez</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                url("{{ url_for('static', filename='img/LogInUI.png') }}");
            background-size: cover;
            background-position: center;
        }

        /* ── Login card ── */
        .login-card {
            display: flex;
            width: 950px;
            height: 520px;
            background: #fdfdfd;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        /* LEFT */
        .card-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }
        .card-left img { width: 240px; margin-bottom: 22px; }
        .card-left h1 { color: #4b0a0a; font-size: 2.6rem; font-weight: 800; line-height: 1.1; margin-bottom: 5px; }
        .card-left p  { color: #4b0a0a; font-weight: 700; font-size: 1.1rem; letter-spacing: 0.5px; }

        /* RIGHT */
        .card-right {
            flex: 1.1;
            background: linear-gradient(145deg, #4b0a0a 0%, #800000 60%, #b22222 100%);
            padding: 50px 45px 40px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-radius: 40px;
            box-shadow: -5px 0 25px rgba(0,0,0,0.2);
        }
        .card-right h2 { font-size: 3rem; margin-bottom: 28px; font-weight: 700; letter-spacing: -1px; }

        /* FORM */
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; font-weight: 800; margin-bottom: 8px; letter-spacing: 1px; opacity: 0.9; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 13px 18px;
            border: none;
            border-radius: 8px;
            background: #d9cccc;
            font-size: 1rem;
            color: #333;
            outline: none;
        }

        .pw-wrapper { position: relative; }
        .pw-wrapper input { padding-right: 46px; }
        .pw-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #888;
            font-size: 1rem;
            padding: 0;
            line-height: 1;
        }
        .pw-toggle:hover { color: #555; }

        .forgot-link {
            display: block;
            text-align: right;
            margin-top: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(255,255,255,0.75);
            cursor: pointer;
            text-decoration: none;
            font-style: italic;
            transition: color 0.2s;
        }
        .forgot-link:hover { color: #fff; }

        .login-btn {
            width: 100%;
            max-width: 240px;
            padding: 11px;
            margin: 18px auto 0;
            background: #fffdf9;
            color: #4b0a0a;
            border: none;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: block;
        }
        .login-btn:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }

        .error-msg { color: #ffeb3b; font-size: 0.85rem; margin-top: 12px; text-align: center; font-weight: 600; }

    </style>
</head>
<body>

    <!-- Main login card -->
    <div class="login-card">
        <div class="card-left">
            <img src="{{ url_for('static', filename='img/pup-logo.png') }}" alt="PUP Logo">
            <h1>PUP LOPEZ</h1>
            <p>ACADEMIC SCHEDULING SYSTEM</p>
        </div>

        <div class="card-right">
            <h2>Login</h2>

            <form action="/login" method="POST" style="display:flex;flex-direction:column;" autocomplete="off">
                <!-- Dummy hidden fields absorb browser autofill before it reaches the real inputs -->
                <input type="text"     style="display:none" autocomplete="username">
                <input type="password" style="display:none" autocomplete="current-password">

                <div class="form-group">
                    <label>USERNAME</label>
                    <input type="text" name="username" value="{{ saved_username }}" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label>PASSWORD</label>
                    <div class="pw-wrapper">
                        <input type="password" name="password" id="mainPassword" required autocomplete="new-password">
                        <button type="button" class="pw-toggle" onclick="togglePw('mainPassword', this)" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <a href="{{ url_for('forgot_password', restart=1) }}" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">LOGIN</button>
            </form>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                <p class="error-msg">{{ message }}</p>
                {% endfor %}
            {% endif %}
            {% endwith %}
        </div>
    </div>

<script>
    function togglePw(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon  = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    // After a failed login attempt, jump straight into the (empty) password field
    // so the user can retype it without an extra click.
    if (document.querySelector('.error-msg')) {
        document.getElementById('mainPassword')?.focus();
    }
</script>
</body>
</html>
