{% extends "admin/base_admin.html" %}

{% block head %}
{{ super() }}
<link rel="stylesheet" href="{{ url_for('static', filename='css/room_schedule_grid.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/room_schedule_v2.css') }}?v=20261007a">
<style>
    .frs-wrap { padding: 28px 32px; background: #fff; font-family: 'Inter', sans-serif; }

    /* ── Page header ── */
    .frs-header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
    }
    .frs-page-title {
        font-size: 1.8rem;
        font-weight: 900;
        color: #800000;
        letter-spacing: .5px;
        margin: 0;
        text-transform: uppercase;
    }
    .frs-active-term-badge {
        font-size: .8rem;
        font-weight: 700;
        color: #800000;
        background: #fbeaea;
        border: 1px solid #e5b8b8;
        border-radius: 20px;
        padding: 6px 14px;
        text-transform: uppercase;
        letter-spacing: .3px;
        white-space: nowrap;
    }

    /* ── Main tabs ── */
    .frs-main-tabs {
        display: flex;
        gap: 0;
        border: 1px solid #800000;
        border-radius: 6px;
        overflow: hidden;
        width: 100%;
        margin-bottom: 20px;
    }
    .frs-main-tab-btn {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 10px 22px;
        border: none;
        background: #fff;
        color: #800000;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: .5px;
        text-transform: uppercase;
        cursor: pointer;
        border-right: 1px solid #800000;
        transition: all 0.2s;
    }
    .frs-main-tab-btn.active { background: #800000; color: #fff; }
    .frs-main-tab-btn i { font-size: 0.9rem; }

    /* ── Building tabs ── */
    .frs-bldg-tabs {
        display: flex;
        gap: 0;
        border: 1px solid #800000;
        border-radius: 6px;
        margin-bottom: 20px;
        overflow-x: auto;
    }
    .frs-bldg-tab {
        padding: 10px 18px;
        border: none;
        background: #fff;
        color: #800000;
        font-size: 0.8rem;
        font-weight: 800;
        text-transform: uppercase;
        cursor: pointer;
        white-space: nowrap;
        border-right: 1px solid rgba(128,0,0,0.2);
        transition: background 0.12s;
    }
    .frs-bldg-tab:last-child { border-right: none; }
    .frs-bldg-tab.active { background: #800000; color: #fff; }

    /* ── Body ── */
    /* Fixed (not min-) height so the room list and calendar grid below can
       each scroll within their own bounded box instead of the whole page
       growing with the schedule — keeps the header, tabs, and floor/room
       selection visible no matter how many schedule entries there are. */
    .frs-body {
        display: flex;
        gap: 20px;
        height: 640px;
        min-height: 0;
    }

    /* Left sidebar */
    .frs-left {
        flex: 0 0 140px;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }
    .frs-sidebar-label {
        font-size: 0.55rem;
        font-weight: 800;
        color: #888;
        text-transform: uppercase;
        margin-bottom: 5px;
        letter-spacing: 0.5px;
    }
    .frs-floor-select {
        padding: 6px 8px;
        border: 1px solid #800000;
        border-radius: 4px;
        color: #800000;
        font-size: 0.75rem;
        font-weight: 800;
        cursor: pointer;
        width: 100%;
        margin-bottom: 15px;
        background: #fff;
    }
    .frs-room-list { flex: 1; min-height: 0; overflow-y: auto; border: 1px solid #800000; border-radius: 6px; padding: 5px 0; background: #fff; }
    .frs-room-item {
        display: block;
        padding: 10px 15px;
        font-size: 0.8rem;
        font-weight: 800;
        color: #333;
        background: #fff;
        cursor: pointer;
        text-align: center;
        transition: all 0.1s;
    }
    .frs-room-item:hover { background: #f8f2f2; }
    .frs-room-item.active {
        background: #800000;
        color: #fff;
        border-radius: 6px;
        margin: 0 5px;
    }
    .frs-room-empty { padding: 20px 10px; text-align: center; font-size: 0.75rem; color: #aaa; }

    /* Calendar */
    .frs-cal-wrap {
        flex: 1;
        min-height: 0;
        overflow-x: auto;
        display: flex;
        flex-direction: column;
        border: 1px solid #800000;
        border-radius: 6px;
        background: #fff;
    }
    .frs-cal-title {
        padding: 12px 16px;
        background: #fff;
        color: #800000;
        font-size: 0.75rem;
        font-weight: 900;
        text-transform: uppercase;
        border-bottom: 1px solid #800000;
    }
    /* .frs-grid*, .frs-pill*, .frs-cal-loading rules moved to
       static/css/room_schedule_grid.css so the Reports module's Room
       Schedule preview can reuse them too. */

    /* ── Available Rooms ── */
    .frs-avail-wrap { display: flex; gap: 24px; }
    .frs-avail-filters { flex: 0 0 220px; }
    .frs-avail-filters-header {
        background: #5C0A0A;
        color: #fff;
        padding: 12px 15px;
        font-size: 0.85rem;
        font-weight: 900;
        border-radius: 6px 6px 0 0;
        display: flex;
        align-items: center;
        gap: 8px;
        text-transform: uppercase;
    }
    .frs-avail-filters-body {
        border: 1px solid #800000;
        border-top: none;
        border-radius: 0 0 6px 6px;
        padding: 15px;
        background: #fff;
    }
    .frs-avail-filter-group { margin-bottom: 12px; }
    .frs-avail-filter-label {
        font-size: 0.65rem;
        font-weight: 800;
        text-transform: uppercase;
        color: #800000;
        display: block;
        margin-bottom: 5px;
    }
    .frs-avail-filter-group select,
    .frs-avail-filter-group input {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #800000;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: 700;
        color: #800000;
        background: #fff;
        box-sizing: border-box;
    }
    .frs-avail-results { flex: 1; }
    .frs-avail-results-header {
        background: #FFF9ED;
        border: 1px solid #800000;
        border-radius: 6px;
        padding: 12px 16px;
        font-size: 0.8rem;
        font-weight: 800;
        color: #800000;
        margin-bottom: 20px;
        text-transform: uppercase;
    }
    .frs-avail-building-title {
        font-size: 0.8rem;
        font-weight: 900;
        text-transform: uppercase;
        color: #5C0A0A;
        border-bottom: 2px solid #800000;
        padding-bottom: 6px;
        margin: 0 0 15px;
    }
    .frs-avail-cards { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; }
    .frs-avail-card {
        background: #fff;
        border: 1px solid #800000;
        border-radius: 8px;
        padding: 12px 15px;
        min-width: 160px;
        position: relative;
    }
    .frs-avail-dot {
        position: absolute;
        top: 12px; right: 12px;
        width: 12px; height: 12px;
        border-radius: 50%;
        background: #84C784;
    }
    .frs-avail-room-name { font-size: 1.1rem; font-weight: 900; color: #5C0A0A; margin: 0 0 10px; }
    .frs-avail-badge { display: inline-block; font-size: 0.6rem; font-weight: 900; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; margin-right: 6px; }
    .frs-badge-lec { background: #FDE08B; color: #333; }
    .frs-badge-lab { background: #A9C2F0; color: #333; }
    .frs-avail-time { font-size: 0.65rem; color: #333; font-weight: 800; display: block; margin-top: 6px; }
    .frs-avail-detail { font-size: 0.62rem; color: #666; margin-top: 4px; }
    .frs-avail-status-chip {
        display: inline-block;
        margin-top: 8px;
        padding: 2px 10px;
        border-radius: 20px;
        background: #eafaf1;
        color: #1a6b3c;
        font-size: 0.6rem;
        font-weight: 900;
        border: 1px solid #27ae60;
        text-transform: uppercase;
    }

    /* ── Detail Modal ── */
    .frs-detail-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.45);
        z-index: 9500;
        align-items: center;
        justify-content: center;
    }
    .frs-detail-overlay.open { display: flex; }
    .frs-detail-box {
        background: #fff;
        border-radius: 12px;
        width: min(480px, 96vw);
        box-shadow: 0 10px 36px rgba(0,0,0,.25);
        overflow: hidden;
        position: relative;
    }
    .frs-detail-accent { height: 6px; width: 100%; }
    .frs-detail-hdr {
        padding: 18px 22px 10px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
    }
    .frs-detail-code { font-size: 1.35rem; font-weight: 900; color: #5c0000; letter-spacing: .5px; line-height: 1.2; }
    .frs-detail-name { font-size: 0.8rem; font-weight: 600; color: #555; margin-top: 3px; }
    .frs-detail-close { background: none; border: none; font-size: 1.1rem; cursor: pointer; color: #888; padding: 0; flex-shrink: 0; line-height: 1; }
    .frs-detail-close:hover { color: #333; }
    .frs-detail-badge { display: inline-block; font-size: 0.6rem; font-weight: 900; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 14px; margin-left: 22px; }
    .frs-detail-badge-pub   { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .frs-detail-badge-draft { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .frs-detail-badge-local { background: #cce5ff; color: #004085; border: 1px solid #b8daff; }
    .frs-detail-divider { border: none; border-top: 1px solid #eee; margin: 0 22px 14px; }
    .frs-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; padding: 0 22px 20px; }
    .frs-detail-label { font-size: 0.58rem; font-weight: 900; text-transform: uppercase; letter-spacing: .8px; color: #800000; margin-bottom: 3px; }
    .frs-detail-value { font-size: 0.82rem; font-weight: 700; color: #222; }
    .frs-detail-field.full { grid-column: 1 / -1; }
</style>
{% endblock %}

{% block content %}
{% include "shared/_room_schedule_body.html" %}
{% endblock %}
