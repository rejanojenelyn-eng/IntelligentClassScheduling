{% extends "admin/base_admin.html" %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reports.css') }}">
{% endblock %}

{% block content %}
<div class="dashboard-wrapper">

    <div class="page-header">
        <h1>GENERATE REPORTS</h1>
    </div>

    <div class="reports-grid">

        <div class="report-card card-green" onclick="openReportModal('class_schedule')">
            <i class="fas fa-chalkboard-teacher card-icon"></i>
            <h2>CLASS<br>SCHEDULE</h2>
            <button class="btn-generate">GENERATE</button>
        </div>

        <div class="report-card card-orange" onclick="openReportModal('room_schedule')">
            <i class="fas fa-door-open card-icon"></i>
            <h2>ROOM<br>SCHEDULE</h2>
            <button class="btn-generate">GENERATE</button>
        </div>

        <div class="report-card card-blue" onclick="openReportModal('faculty')">
            <i class="fas fa-users card-icon"></i>
            <h2>EMPLOYEE<br>LIST</h2>
            <button class="btn-generate">GENERATE</button>
        </div>

        <div class="report-card card-yellow" onclick="openReportModal('curriculum')">
            <i class="fas fa-book card-icon"></i>
            <h2>CURRICULUM<br>LIST</h2>
            <button class="btn-generate">GENERATE</button>
        </div>

        <div class="report-card card-purple" onclick="openReportModal('rooms')">
            <i class="fas fa-building card-icon"></i>
            <h2>ROOM AND<br>BUILDING LIST</h2>
            <button class="btn-generate">GENERATE</button>
        </div>

        <div class="report-card card-pink" onclick="openReportModal('assignments')">
            <i class="fas fa-user-tie card-icon"></i>
            <h2>TEACHING<br>ASSIGNMENT</h2>
            <button class="btn-generate">GENERATE</button>
        </div>

        <div class="report-card card-red" onclick="openReportModal('offerings')">
            <i class="fas fa-bookmark card-icon"></i>
            <h2>ACADEMIC<br>OFFERINGS</h2>
            <button class="btn-generate">GENERATE</button>
        </div>

    </div>

</div>

<!-- Unified Report Generation Modal -->
<div id="reportModal" class="rpt-modal">
    <div class="rpt-modal-content">
        <div class="rpt-modal-header">
            <h2 id="modalTitle">GENERATE REPORT</h2>
            <i class="fas fa-times" onclick="closeReportModal()"></i>
        </div>

        <div class="rpt-modal-body">
            <input type="hidden" id="rptType">

            <div class="filter-grid">

                <div class="filter-group hidden" id="grpAY">
                    <label>Academic Year</label>
                    <select id="rptAY" class="rpt-select">
                        {% for ay in ay_list %}
                        <option value="{{ ay.academicyearid }}">A.Y {{ ay.yearstart }}-{{ ay.yearend }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="filter-group hidden" id="grpSem">
                    <label>Semester</label>
                    <select id="rptSem" class="rpt-select">
                        <option value="All">All Semesters</option>
                        <option value="A">1st Semester</option>
                        <option value="B">2nd Semester</option>
                        <option value="C">Summer</option>
                    </select>
                </div>

                <div class="filter-group hidden" id="sgProgram">
                    <label>Program</label>
                    <select id="rptProgram" class="rpt-select" onchange="onProgramChange()">
                        <option value="All">All Programs</option>
                        {% for p in programs %}
                        <option value="{{ p.programcode }}">{{ p.programname }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="filter-group hidden" id="sgYearLevel">
                    <label>Year Level</label>
                    <select id="rptYearLevel" class="rpt-select">
                        <option value="All">All Levels</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>
                        <option value="5">5th Year</option>
                    </select>
                </div>

                <div class="filter-group hidden" id="sgInstructor">
                    <label>Instructor</label>
                    <select id="rptInstructor" class="rpt-select">
                        <option value="All">All Instructors</option>
                        {% for f in faculty %}
                        <option value="{{ f.employeenumber }}">{{ f.fullname }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="filter-group hidden" id="sgFacultyType">
                    <label>Faculty Type</label>
                    <select id="rptFacultyType" class="rpt-select">
                        <option value="All">All Types</option>
                        {% for et in emp_types %}
                        <option value="{{ et.employeetypeid }}">{{ et.typename }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="filter-group hidden" id="sgFacultyStatus">
                    <label>Status</label>
                    <select id="rptFacultyStatus" class="rpt-select">
                        <option value="All">All Statuses</option>
                        {% for s in statuses %}
                        <option value="{{ s.employeestatus }}">{{ s.employeestatus }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="filter-group hidden" id="sgSpecialization">
                    <label>Specialization</label>
                    <select id="rptSpecialization" class="rpt-select">
                        <option value="All">All Specializations</option>
                        {% for sp in specializations %}
                        <option value="{{ sp.specializationid }}">{{ sp.specializationname }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="filter-group hidden" id="sgBuilding">
                    <label>Building</label>
                    <select id="rptBuilding" class="rpt-select">
                        <option value="All">All Buildings</option>
                        {% for b in buildings %}
                        <option value="{{ b.buildingid }}">{{ b.buildingname }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="filter-group hidden" id="sgRoomType">
                    <label>Room Type</label>
                    <select id="rptRoomType" class="rpt-select">
                        <option value="All">All Types</option>
                        {% for rt in room_types %}
                        <option value="{{ rt.roomtype }}">{{ rt.roomtype }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="filter-group hidden" id="sgCurriculum">
                    <label>Curriculum</label>
                    <select id="rptCurriculum" class="rpt-select">
                        <option value="All">All Curricula</option>
                        {% for c in curricula %}
                        <option value="{{ c.curriculumid }}" data-prog="{{ c.programcode }}">
                            {{ c.programcode }} — {{ c.curriculumcode }} ({{ c.curriculumyear }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div id="previewArea" style="display:none;"></div>
        </div>

        <div class="rpt-modal-footer">
            <button class="btn-preview" onclick="applyFilter()">Preview Data</button>
            <div class="export-actions">
                <button class="btn-export btn-excel" onclick="exportExcel()">
                    <i class="fas fa-file-excel"></i> Export Excel
                </button>
                <button class="btn-export btn-pdf" onclick="exportPdf()">
                    <i class="fas fa-file-pdf"></i> Print PDF
                </button>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/ACAD HEAD/reports.js') }}"></script>
{% endblock %}
