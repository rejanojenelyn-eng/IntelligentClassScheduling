<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Your Account - PUP Lopez</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { min-height: 100vh; background: #fdfdfd; display: flex; justify-content: center; padding: 50px 20px; }
        .setup-card { width: 100%; max-width: 620px; text-align: center; }
        .setup-card img.logo { width: 90px; margin-bottom: 10px; }
        .brand-title { color: #4b0a0a; font-weight: 800; font-size: 1.3rem; letter-spacing: 0.5px; }
        .brand-sub { color: #4b0a0a; font-weight: 700; font-size: 0.75rem; letter-spacing: 1px; margin-bottom: 28px; }

        h1.step-title { color: #800000; font-weight: 800; font-size: 2.4rem; margin-bottom: 8px; }
        p.step-sub { color: #666; font-size: 1.05rem; margin-bottom: 34px; }

        .form-group { text-align: left; margin-bottom: 22px; }
        label { display: block; color: #800000; font-weight: 800; font-size: 0.75rem; letter-spacing: 1px; margin-bottom: 8px; }

        .pw-wrapper { position: relative; }
        .pw-wrapper input {
            width: 100%; padding: 15px 46px 15px 18px; border: none; border-radius: 8px;
            background: linear-gradient(90deg, #4b0a0a 0%, #b22222 100%);
            color: #fff; font-size: 1rem; outline: none;
        }
        .pw-wrapper input::placeholder { color: rgba(255,255,255,0.75); }
        .pw-toggle {
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; color: #fff; font-size: 1rem; padding: 0;
        }

        .error-msg { color: #b22222; font-size: 0.85rem; margin-top: -10px; margin-bottom: 18px; font-weight: 600; text-align: left; }

        .btn-row { text-align: right; margin-top: 30px; }
        .btn-continue {
            padding: 13px 40px; border: 2px solid #800000; border-radius: 8px; background: #fff;
            color: #800000; font-weight: 800; font-size: 1rem; cursor: pointer; transition: 0.2s;
        }
        .btn-continue:hover { background: #800000; color: #fff; }
    </style>
</head>
<body>
    <div class="setup-card">
        <img class="logo" src="{{ url_for('static', filename='img/pup-logo.png') }}" alt="PUP Logo">
        <div class="brand-title">PUP LOPEZ</div>
        <div class="brand-sub">ACADEMIC SCHEDULING SYSTEM</div>

        <h1 class="step-title">Let&rsquo;s set up your account!</h1>
        <p class="step-sub">Please change your default password</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="error-msg">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" autocomplete="off">
            <div class="form-group">
                <label>CURRENT PASSWORD</label>
                <div class="pw-wrapper">
                    <input type="password" name="current_password" id="pwCurrent" required autocomplete="current-password">
                    <button type="button" class="pw-toggle" onclick="togglePw('pwCurrent', this)" tabindex="-1"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            <div class="form-group">
                <label>NEW PASSWORD</label>
                <div class="pw-wrapper">
                    <input type="password" name="new_password" id="pwNew" required minlength="6" autocomplete="new-password">
                    <button type="button" class="pw-toggle" onclick="togglePw('pwNew', this)" tabindex="-1"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            <div class="form-group">
                <label>CONFIRM PASSWORD</label>
                <div class="pw-wrapper">
                    <input type="password" name="confirm_password" id="pwConfirm" required minlength="6" autocomplete="new-password">
                    <button type="button" class="pw-toggle" onclick="togglePw('pwConfirm', this)" tabindex="-1"><i class="fas fa-eye"></i></button>
                </div>
            </div>

            <div class="btn-row">
                <button type="submit" class="btn-continue">CONTINUE</button>
            </div>
        </form>
    </div>

<script>
    function togglePw(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon  = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }
</script>
</body>
</html>
