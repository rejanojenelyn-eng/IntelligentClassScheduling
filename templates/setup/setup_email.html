{% extends "setup/_setup_layout.html" %}
{% block content %}
    <p class="step-sub">Check your email information.</p>
    <p class="step-hint">Optional — you can skip this and add it later from Profile Settings.</p>
    <div class="form-group">
        <label>CURRENT EMAIL</label>
        <input type="text" value="{{ current_email or 'Not on file yet' }}" readonly>
    </div>
    <div class="form-group">
        <label for="setupEmail">NEW EMAIL</label>
        <input type="email" id="setupEmail" name="email" value="{{ draft_email }}"
               placeholder="you@example.com">
    </div>
{% endblock %}
{% block scripts %}
<script>
    window.setupValidateContinue = function () {
        const email = document.getElementById('setupEmail').value.trim();
        if (!email) return 'Please enter an email address, or choose Skip.';
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || email.length > 255)
            return 'Please enter a valid email address, or choose Skip.';
        return '';
    };
</script>
{% endblock %}
