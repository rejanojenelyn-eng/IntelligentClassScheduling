<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Your Account - PUP Lopez</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { min-height: 100vh; background: #fdfdfd; display: flex; justify-content: center; padding: 50px 20px; }
        .setup-card { width: 100%; max-width: 620px; text-align: center; }
        .setup-card img.logo { width: 90px; margin-bottom: 10px; }
        .brand-title { color: #4b0a0a; font-weight: 800; font-size: 1.3rem; letter-spacing: 0.5px; }
        .brand-sub { color: #4b0a0a; font-weight: 700; font-size: 0.75rem; letter-spacing: 1px; margin-bottom: 22px; }

        p.step-sub { color: #666; font-size: 1.3rem; margin: 18px 0 10px; }
        p.step-hint { color: #999; font-size: 0.85rem; margin-bottom: 26px; }

        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; color: #800000; font-weight: 800; font-size: 0.75rem; letter-spacing: 1px; margin-bottom: 8px; }
        input[type="text"], input[type="email"], input[type="tel"] {
            width: 100%; padding: 15px 18px; border: none; border-radius: 8px;
            background: linear-gradient(90deg, #4b0a0a 0%, #b22222 100%);
            color: #fff; font-size: 1rem; outline: none;
        }
        input[readonly] { opacity: 0.75; cursor: not-allowed; }
        input::placeholder { color: rgba(255,255,255,0.75); }

        .error-msg { color: #b22222; font-size: 0.85rem; margin-bottom: 18px; font-weight: 600; text-align: left; }

        {% include "setup/_setup_steps_css.html" %}
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <div class="setup-card">
        <img class="logo" src="{{ url_for('static', filename='img/pup-logo.png') }}" alt="PUP Logo">
        <div class="brand-title">PUP LOPEZ</div>
        <div class="brand-sub">ACADEMIC SCHEDULING SYSTEM</div>

        {% include "setup/_setup_steps.html" %}

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="error-msg">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data" autocomplete="off" novalidate>
            {% block content %}{% endblock %}

            <!-- Back / Skip / Continue. Back keeps what you typed; Skip leaves this item as it is. -->
            <div class="setup-actions">
                <button type="submit" name="action" value="back" class="btn-back">
                    <i class="fas fa-arrow-left"></i> BACK
                </button>
                <div class="setup-actions-right">
                    <button type="submit" name="action" value="skip" class="btn-skip">SKIP</button>
                    <button type="submit" name="action" value="continue" class="btn-continue">CONTINUE</button>
                </div>
            </div>
        </form>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
