{% extends "academic/base.html" %}

{% block head %}
<style>
    /* ---- layout ---- */
    .vh-container { padding: 0; width: 100%; }

    .vh-header-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 24px;
        gap: 12px;
    }

    .vh-title {
        font-size: 1.35rem;
        font-weight: 700;
        color: #800000;
        letter-spacing: .3px;
        margin: 0 0 4px;
    }

    .vh-subtitle {
        font-size: 0.72rem;
        font-weight: 700;
        color: #aaa;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin: 0;
    }

    /* ---- filter bar ---- */
    .vh-filter-bar {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: flex-end;
        background: #fff;
        border: 1px solid #e8c8c8;
        border-radius: 8px;
        padding: 14px 20px;
        margin-bottom: 20px;
    }

    .vh-filter-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .vh-filter-group label {
        font-size: 0.6rem;
        font-weight: 900;
        letter-spacing: 1.5px;
        color: #888;
        text-transform: uppercase;
    }

    .vh-filter-group select,
    .vh-filter-group input {
        padding: 7px 12px;
        border: 1.5px solid #ddd;
        border-radius: 5px;
        font-size: 0.78rem;
        font-weight: 600;
        color: #333;
        min-width: 160px;
    }

    .vh-filter-group input { min-width: 200px; }

    .vh-filter-group select:focus,
    .vh-filter-group input:focus {
        outline: none;
        border-color: #630100;
    }

    /* ---- program accordion ---- */
    .vh-program-section {
        background: #fff;
        border: 1px solid #e8c8c8;
        border-radius: 8px;
        margin-bottom: 12px;
        overflow: hidden;
    }

    .vh-program-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px;
        cursor: pointer;
        background: #fff;
        border-bottom: 1px solid transparent;
        transition: background 0.15s;
        user-select: none;
    }

    .vh-program-header:hover { background: #fdf2f2; }

    .vh-program-header.open {
        border-bottom-color: #e8c8c8;
        background: #fdf2f2;
    }

    .vh-program-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .vh-program-icon {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #f8eded;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #630100;
        font-size: 0.9rem;
        flex-shrink: 0;
    }

    .vh-program-name {
        font-size: 0.9rem;
        font-weight: 900;
        color: #630100;
        letter-spacing: 1.2px;
        text-transform: uppercase;
    }

    .vh-program-meta {
        font-size: 0.68rem;
        color: #aaa;
        font-weight: 600;
    }

    .vh-chevron {
        font-size: 0.8rem;
        color: #630100;
        transition: transform 0.25s;
    }

    .vh-chevron.open { transform: rotate(180deg); }

    .vh-program-body {
        display: none;
        padding: 16px 20px;
    }

    .vh-program-body.open { display: block; }

    /* ---- semester sub-group ---- */
    .vh-sem-group { margin-bottom: 20px; }
    .vh-sem-group:last-child { margin-bottom: 0; }

    .vh-sem-header {
        font-size: 0.68rem;
        font-weight: 900;
        letter-spacing: 1.5px;
        color: #888;
        text-transform: uppercase;
        padding: 0 0 8px 0;
        border-bottom: 1.5px solid #f0e0e0;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 7px;
    }

    .vh-sem-header i { color: #c0392b; font-size: 0.7rem; }

    /* ---- version table ---- */
    .vh-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.78rem;
    }

    .vh-table th {
        text-align: left;
        padding: 7px 12px;
        font-size: 0.6rem;
        font-weight: 900;
        letter-spacing: 1px;
        color: #888;
        text-transform: uppercase;
        border-bottom: 1.5px solid #eee;
        white-space: nowrap;
    }

    .vh-table td {
        padding: 10px 12px;
        border-bottom: 1px solid #f8f4f4;
        vertical-align: middle;
    }

    .vh-table tbody tr:last-child td { border-bottom: none; }
    .vh-table tbody tr:hover td { background: #fdf6f6; }

    .vh-year-cell {
        font-weight: 800;
        color: #444;
        white-space: nowrap;
        min-width: 90px;
        font-size: 0.75rem;
    }

    /* ---- version chain ---- */
    .vh-version-chain {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 5px;
    }

    .vh-version-unit {
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }

    .vh-version-arrow {
        color: #ccc;
        font-size: 0.62rem;
    }

    .vh-version-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.62rem;
        font-weight: 800;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        white-space: nowrap;
    }

    .vh-pill-published {
        background: #e8f8ee;
        color: #1a7a2e;
        border: 1.5px solid #b2dbb5;
    }

    .vh-pill-draft {
        background: #fff8e1;
        color: #946300;
        border: 1.5px solid #ffe082;
    }

    .vh-pill-archive {
        background: #f4f4f4;
        color: #777;
        border: 1.5px solid #ddd;
    }

    .vh-pub-version-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        border-radius: 20px;
        font-size: 0.58rem;
        font-weight: 700;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        white-space: nowrap;
        background: #1a7a2e;
        color: #fff;
        border: none;
    }

    .vh-pill-approved {
        background: #eef2ff;
        color: #3a56b0;
        border: 1.5px solid #c7d2f8;
    }

    /* ---- restore button ---- */
    .btn-vh-restore {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 3px 8px;
        border-radius: 12px;
        font-size: 0.58rem;
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        background: #fff;
        color: #630100;
        border: 1.5px solid #e8b4b4;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
    }

    .btn-vh-restore:hover {
        background: #fff0f0;
        border-color: #630100;
    }

    /* ---- view (overlay) button ---- */
    .btn-vh-view {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 3px 8px;
        border-radius: 12px;
        font-size: 0.58rem;
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        background: #fff;
        color: #2471a3;
        border: 1.5px solid #aed6f1;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.15s, border-color 0.15s;
    }

    .btn-vh-view:hover {
        background: #eaf4fd;
        border-color: #2471a3;
    }

    /* ---- states ---- */
    .vh-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 70px 20px;
        color: #630100;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .vh-error {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 20px;
        background: #fff5f5;
        border: 1px solid #fcc;
        border-radius: 8px;
        color: #c0392b;
        font-size: 0.82rem;
        font-weight: 700;
        margin-bottom: 12px;
    }

    .vh-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 70px 20px;
        color: #aaa;
        text-align: center;
    }

    .vh-empty-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        color: #ccc;
        margin-bottom: 16px;
    }

    .vh-empty-title {
        font-size: 0.88rem;
        font-weight: 800;
        color: #888;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
    }

    .vh-empty-sub { font-size: 0.75rem; color: #bbb; }

    /* ---- restore modal ---- */
    .vh-modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: 9000;
        align-items: center;
        justify-content: center;
    }
    .vh-modal-overlay.active { display: flex; }

    .vh-modal {
        background: #fff;
        border-radius: 10px;
        max-width: 480px;
        width: 92%;
        box-shadow: 0 12px 40px rgba(0,0,0,0.2);
        overflow: hidden;
    }

    .vh-modal-header {
        padding: 14px 20px;
        background: #630100;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.9rem;
        font-weight: 900;
        letter-spacing: 0.3px;
        text-transform: uppercase;
    }

    .vh-modal-content { padding: 20px 24px 8px; }

    .vh-modal-desc {
        font-size: 0.8rem;
        color: #555;
        line-height: 1.6;
        margin: 0 0 16px;
    }

    .vh-restore-option {
        border: 2px solid #ddd;
        border-radius: 8px;
        padding: 13px 15px;
        margin-bottom: 10px;
        cursor: pointer;
        background: #fff;
        transition: border-color 0.15s, background 0.15s;
        display: flex;
        align-items: flex-start;
        gap: 12px;
    }
    .vh-restore-option.selected {
        border-color: #630100;
        background: #fdf2f2;
    }
    .vh-radio {
        width: 16px; height: 16px;
        border-radius: 50%;
        border: 2px solid #bbb;
        background: #fff;
        flex-shrink: 0;
        margin-top: 2px;
        display: flex; align-items: center; justify-content: center;
        transition: border-color 0.15s, background 0.15s;
    }
    .vh-restore-option.selected .vh-radio {
        background: #630100; border-color: #630100;
    }
    .vh-radio-dot {
        width: 6px; height: 6px;
        border-radius: 50%; background: #fff;
        display: none;
    }
    .vh-restore-option.selected .vh-radio-dot { display: block; }

    .vh-opt-title {
        font-size: 0.8rem; font-weight: 900; color: #333; margin-bottom: 3px;
    }
    .vh-restore-option.selected .vh-opt-title { color: #630100; }
    .vh-opt-badge {
        background: #630100; color: #fff;
        padding: 1px 7px; border-radius: 10px;
        font-size: 0.6rem; letter-spacing: 0.5px;
        margin-left: 6px; vertical-align: middle;
    }
    .vh-opt-desc { font-size: 0.72rem; color: #777; line-height: 1.5; }

    .vh-modal-actions {
        padding: 10px 24px 20px;
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        border-top: 1px solid #f0f0f0;
    }

    .btn-vh-modal-cancel {
        padding: 9px 20px;
        border-radius: 6px;
        border: 1.5px solid #ddd;
        background: #fff;
        color: #555;
        font-weight: 800;
        font-size: 0.75rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        transition: border-color 0.15s;
    }
    .btn-vh-modal-cancel:hover { border-color: #999; }

    .btn-vh-modal-restore {
        padding: 9px 22px;
        border-radius: 6px;
        border: none;
        background: #630100;
        color: #fff;
        font-weight: 800;
        font-size: 0.75rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.15s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .btn-vh-modal-restore:hover { background: #7a0100; }
    .btn-vh-modal-restore:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ---- restore warning block ---- */
    .vh-restore-warning-block {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        background: #fff8e1;
        border: 1px solid #ffe082;
        border-radius: 8px;
        padding: 10px 14px;
        margin-bottom: 12px;
    }

    .vh-restore-warn-icon {
        color: #946300;
        font-size: 1.05rem;
        flex-shrink: 0;
        margin-top: 1px;
    }

    .vh-restore-warn-text {
        font-size: 0.78rem;
        color: #946300;
        font-weight: 600;
        line-height: 1.55;
    }

    /* ---- success toast ---- */
    .vh-toast {
        position: fixed;
        bottom: 28px;
        right: 28px;
        background: #1a7a2e;
        color: #fff;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 0.8rem;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        z-index: 99999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
        letter-spacing: 0.3px;
    }

    .vh-toast.show { opacity: 1; }
</style>
{% endblock %}

{% block content %}
<div class="vh-container">

    <div class="vh-header-row">
        <div>
            <h1 class="vh-title">Version History</h1>
            <p class="vh-subtitle" id="vhSubtitle">Loading&hellip;</p>
        </div>
    </div>

    <!-- Filter Bar -->
    <div class="vh-filter-bar" id="vhFilterBar" style="display:none;">
        <div class="vh-filter-group">
            <label>Academic Year</label>
            <select id="vhFilterAY" onchange="vhRenderFiltered()">
                <option value="">All Years</option>
            </select>
        </div>
        <div class="vh-filter-group">
            <label>Semester</label>
            <select id="vhFilterSem" onchange="vhRenderFiltered()">
                <option value="">All Semesters</option>
                <option value="A">1st Semester</option>
                <option value="B">2nd Semester</option>
                <option value="C">Summer</option>
            </select>
        </div>
        <div class="vh-filter-group">
            <label>Search Program</label>
            <input type="text" id="vhFilterProg" placeholder="e.g. BSIT" oninput="vhRenderFiltered()">
        </div>
    </div>

    <!-- Main Content -->
    <div id="vhContent">
        <div class="vh-loading">
            <i class="fas fa-spinner fa-spin"></i>&nbsp; Loading version history&hellip;
        </div>
    </div>

</div>

<!-- Restore Confirmation Modal -->
<div class="vh-modal-overlay" id="vhRestoreModal">
    <div class="vh-modal">
        <div class="vh-modal-header">
            <i class="fas fa-undo-alt"></i> <span id="vhRestoreModalTitle">Restore Revision</span>
        </div>
        <div class="vh-modal-content">
            <div class="vh-restore-warning-block" id="vhRestoreWarningBlock" style="display:none;">
                <div class="vh-restore-warn-icon"><i class="fas fa-exclamation-triangle"></i></div>
                <div class="vh-restore-warn-text" id="vhRestoreModalDesc"></div>
            </div>
            <p class="vh-modal-desc" id="vhRestoreModalDescPlain"></p>
        </div>
        <div class="vh-modal-actions" id="vhRestoreModalActions">
            <!-- populated dynamically -->
        </div>
    </div>
</div>

<!-- Success toast -->
<div class="vh-toast" id="vhToast">
    <i class="fas fa-check-circle"></i>
    <span id="vhToastMsg"></span>
</div>

<script src="{{ url_for('static', filename='js/ACAD HEAD/versionHistory.acad.js') }}"></script>
{% endblock %}
