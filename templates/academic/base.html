<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUPLC Scheduling System | Academic Head</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- All design is now handled by this one file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block head %}{% endblock %}
</head>

<body>

    <!-- TOP HEADER -->
    <header class="top-nav">
        <div class="nav-left">
            <img src="{{ url_for('static', filename='img/pup-logo.png') }}" alt="PUP Logo">
            <h1>PUPLC Scheduling System</h1>
        </div>
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search records...">
        </div>
        <div class="nav-right">
            <span class="ay-label">A.Y 2025 - 2026</span>
            <div class="user-profile">
                <i class="far fa-user-circle" style="font-size: 1.6rem;"></i>
                <span style="font-weight: 600;">Acad head</span>
                <i class="fas fa-caret-down"></i>
            </div>
        </div>
    </header>

    <!-- TOGGLE BAR -->
    <div class="sub-header">
        <i class="fas fa-bars toggle-btn" id="toggleBtn"></i>
    </div>

    <div class="main-container">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="sidebar">
            <nav class="sidebar-nav-container">
                <ul class="nav-list">
                    <li class="nav-item {{ 'active' if request.path == url_for('dashboard') }}">
                        <a href="{{ url_for('dashboard') }}" class="nav-link">
                            <i class="fas fa-th-large"></i><span class="nav-label">Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item {{ 'active' if request.path == '/employee' }}">
                        <a href="/employee" class="nav-link"><i class="fas fa-users"></i><span
                                class="nav-label">Employee Management</span></a>
                    </li>
                    <li class="nav-item {{ 'active' if request.path == '/curriculum' }}">
                        <a href="/curriculum" class="nav-link"><i class="fas fa-book"></i><span
                                class="nav-label">Curriculum</span></a>
                    </li>
                    <li class="nav-item {{ 'active' if request.path == '/room' }}">
                        <a href="/room" class="nav-link"><i class="fas fa-door-open"></i><span
                                class="nav-label">Rooms</span></a>
                    </li>
                    <li class="nav-item {{ 'active' if request.path == '/schedule' }}">
                        <a href="/schedule" class="nav-link"><i class="fas fa-calendar-alt"></i><span
                                class="nav-label">Schedule</span></a>
                    </li>
                    <li class="nav-item {{ 'active' if request.path == '/reports' }}">
                        <a href="/reports" class="nav-link"><i class="fas fa-calendar-alt"></i><span
                                class="nav-label">Reports</span></a>
                    </li>
                </ul>
            </nav>

            <!-- Sign out button with custom Modal trigger -->
            <div class="signout-container">
                <a href="#" class="nav-link" style="font-weight: 800;" onclick="openLogoutModal(event)">
                    <i class="fas fa-sign-out-alt"></i><span class="nav-label">Sign out</span>
                </a>
            </div>
        </aside>

        <!-- MAIN WRAPPER -->
        <main class="main-wrapper">
            <section class="content-body">
                {% block content %}{% endblock %}
            </section>
        </main>
    </div>

    <!-- Custom Logout Modal (Matches Admin) -->
    <div id="logoutModal" class="logout-modal">
        <div class="modal-content-logout">
            <div class="modal-header-logout"><i class="fas fa-sign-out-alt"></i></div>
            <div class="modal-body-logout">
                <h2 style="margin-bottom:10px;">Confirm Logout</h2>
                <p>Are you sure you want to log out of the PUPLC System?</p>
            </div>
            <div class="modal-footer-logout">
                <button class="btn-modal btn-cancel-logout" onclick="closeLogoutModal()">Cancel</button>
                <button class="btn-modal btn-confirm-logout" onclick="proceedLogout()">Logout</button>
            </div>
        </div>
    </div>

    <script>
        // Sidebar toggle
        const sidebar = document.getElementById("sidebar");
        const toggleBtn = document.getElementById("toggleBtn");
        toggleBtn.onclick = () => { sidebar.classList.toggle("collapsed"); };

        // Custom Logout Modal Functions
        function openLogoutModal(e) {
            e.preventDefault();
            document.getElementById("logoutModal").style.display = "flex";
        }
        function closeLogoutModal() {
            document.getElementById("logoutModal").style.display = "none";
        }
        function proceedLogout() {
            window.location.href = "/logout";
        }

        // Close modal if clicking outside the box
        window.onclick = function (event) {
            let modal = document.getElementById("logoutModal");
            if (event.target == modal) { closeLogoutModal(); }
        }
    </script>
</body>

</html>
