{% extends "academic/base.html" %}

{% block head %}
<style>
    .drafts-container {
        padding: 0;
        width: 100%;
    }

    /* ── Page header ── */
    .drafts-header-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 24px;
        gap: 12px;
    }

    .drafts-title {
        font-size: 1.35rem;
        font-weight: 700;
        color: #800000;
        letter-spacing: .3px;
        margin: 0 0 4px;
    }

    .drafts-subtitle {
        font-size: 0.72rem;
        font-weight: 700;
        color: #aaa;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    /* ── Card ── */
    .draft-card {
        display: flex;
        align-items: center;
        gap: 16px;
        background: #fff;
        border: 1px solid #ead5d5;
        border-left: 5px solid #630100;
        border-radius: 8px;
        padding: 18px 24px;
        margin-bottom: 12px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        transition: box-shadow 0.18s, transform 0.18s;
    }

    .draft-card:hover {
        box-shadow: 0 6px 20px rgba(99,1,0,0.1);
        transform: translateY(-1px);
    }

    .draft-card-icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #f8eded;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        color: #630100;
        font-size: 1.15rem;
    }

    .draft-card-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    .draft-card-eyebrow {
        font-size: 0.6rem;
        font-weight: 800;
        letter-spacing: 1.8px;
        color: #999;
        text-transform: uppercase;
    }

    .draft-card-title {
        font-size: 1.1rem;
        font-weight: 900;
        color: #1e1e1e;
        letter-spacing: 1px;
        text-transform: uppercase;
        line-height: 1.2;
    }

    .draft-card-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 2px;
    }

    .dc-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 0.6rem;
        font-weight: 800;
        letter-spacing: 1px;
        padding: 3px 9px;
        border-radius: 20px;
        text-transform: uppercase;
        white-space: nowrap;
    }

    .dc-badge-draft {
        background: #fff8e1;
        color: #946300;
        border: 1px solid #ffe082;
    }

    .dc-badge-ay {
        background: #eef2ff;
        color: #3a56b0;
        border: 1px solid #c7d2f8;
    }

    .dc-badge-sem {
        background: #f0faf0;
        color: #27703a;
        border: 1px solid #b2dbb5;
    }

    .draft-card-date {
        font-size: 0.62rem;
        color: #bbb;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    /* ── Card actions ── */
    .draft-card-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-shrink: 0;
    }

    .btn-dc {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 9px 18px;
        border-radius: 6px;
        font-weight: 800;
        font-size: 0.72rem;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        cursor: pointer;
        text-decoration: none;
        border: none;
        transition: background 0.18s, box-shadow 0.18s, color 0.18s;
        white-space: nowrap;
    }

    .btn-dc-approve {
        background: #1a7a2e;
        color: #fff;
    }
    .btn-dc-approve:hover {
        background: #145f23;
        color: #fff;
        text-decoration: none;
        box-shadow: 0 3px 10px rgba(26,122,46,0.25);
    }

    /* "Edit to Manual Editor" — maroon, matching Manual Editor header */
    .btn-dc-edit-editor {
        background: #630100;
        color: #fff;
    }
    .btn-dc-edit-editor:hover {
        background: #8b0000;
        color: #fff;
        text-decoration: none;
        box-shadow: 0 3px 10px rgba(99,1,0,0.25);
    }

    .btn-dc-view {
        background: #630100;
        color: #fff;
    }
    .btn-dc-view:hover {
        background: #8b0000;
        color: #fff;
        text-decoration: none;
        box-shadow: 0 3px 10px rgba(99,1,0,0.25);
    }

    .btn-dc-delete {
        background: #fff;
        color: #c0392b;
        border: 2px solid #e8b4b4;
        padding: 7px 14px;
    }
    .btn-dc-delete:hover {
        background: #fff5f5;
        border-color: #c0392b;
        color: #a00;
        box-shadow: 0 3px 10px rgba(192,57,43,0.15);
    }

    /* ── Empty / loading / error ── */
    .drafts-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 70px 20px;
        color: #aaa;
        text-align: center;
    }

    .drafts-empty-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        color: #ccc;
        margin-bottom: 16px;
    }

    .drafts-empty-title {
        font-size: 0.88rem;
        font-weight: 800;
        color: #888;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
    }

    .drafts-empty-sub {
        font-size: 0.75rem;
        color: #bbb;
    }

    .drafts-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 70px 20px;
        color: #630100;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .drafts-error {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 20px;
        background: #fff5f5;
        border: 1px solid #fcc;
        border-radius: 8px;
        color: #c0392b;
        font-size: 0.82rem;
        font-weight: 700;
    }

    /* ── Delete confirmation modal ── */
    .dc-modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: 9000;
        align-items: center;
        justify-content: center;
    }
    .dc-modal-overlay.active { display: flex; }

    .dc-modal {
        background: #fff;
        border-radius: 10px;
        padding: 28px 32px;
        max-width: 420px;
        width: 90%;
        box-shadow: 0 12px 40px rgba(0,0,0,0.2);
        text-align: center;
    }

    .dc-modal-icon {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: #fff5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        color: #c0392b;
        margin: 0 auto 14px;
    }

    .dc-modal-title {
        font-size: 1rem;
        font-weight: 900;
        color: #1e1e1e;
        margin-bottom: 8px;
    }

    .dc-modal-body {
        font-size: 0.8rem;
        color: #666;
        margin-bottom: 22px;
        line-height: 1.5;
    }

    .dc-modal-actions {
        display: flex;
        gap: 10px;
        justify-content: center;
    }

    .btn-modal-cancel {
        padding: 9px 22px;
        border-radius: 6px;
        border: 2px solid #ddd;
        background: #fff;
        color: #555;
        font-weight: 800;
        font-size: 0.75rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        transition: border-color 0.15s;
    }
    .btn-modal-cancel:hover { border-color: #999; }

    .btn-modal-confirm-delete {
        padding: 9px 22px;
        border-radius: 6px;
        border: none;
        background: #c0392b;
        color: #fff;
        font-weight: 800;
        font-size: 0.75rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.15s;
    }
    .btn-modal-confirm-delete:hover { background: #a00; }
    .btn-modal-confirm-delete:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── Scheduler mode toggle (mirrors Manual Editor header) ── */
    .drafts-mode-toggle {
        display: inline-flex;
        gap: 6px;
        background: #f3e8e8;
        border-radius: 8px;
        padding: 5px;
    }
    .drafts-mode-btn {
        padding: 8px 18px;
        border-radius: 6px;
        border: none;
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 1.1px;
        text-transform: uppercase;
        cursor: pointer;
        color: #630100;
        background: transparent;
        transition: background 0.15s, color 0.15s, box-shadow 0.15s;
    }
    .drafts-mode-btn.active {
        background: #630100;
        color: #fff;
        box-shadow: 0 2px 8px rgba(99,1,0,0.25);
    }
    .drafts-mode-btn:not(.active):hover { background: #ead5d5; }

    /* ── VIEW ALL button ── */
    .btn-drafts-viewall {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 9px 20px;
        background: #630100;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.15s;
        flex-shrink: 0;
    }
    .btn-drafts-viewall:hover { background: #7a0100; }

    /* ── Edit to Manual Editor button ── */
    .btn-dc-edit-editor {
        background: #630100;
        color: #fff;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 9px 16px;
        border-radius: 6px;
        font-weight: 800;
        font-size: 0.72rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        text-decoration: none;
        border: none;
        transition: background 0.15s, box-shadow 0.15s;
        white-space: nowrap;
    }
    .btn-dc-edit-editor:hover {
        background: #8b0000;
        color: #fff;
        text-decoration: none;
        box-shadow: 0 3px 10px rgba(99,1,0,0.25);
    }
</style>
{% endblock %}

{% block content %}
<div class="drafts-container">

    <div class="drafts-header-row">
        <div>
            <h1 class="drafts-title">Draft List</h1>
            <p class="drafts-subtitle" id="draftsSubtitle">Loading&hellip;</p>
        </div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <div class="drafts-mode-toggle">
                <button class="drafts-mode-btn active" id="btnDraftOfficial"
                        onclick="setDraftSchedulerFilter('official',this)">
                    <i class="fas fa-university" style="margin-right:5px;"></i> Official Scheduler
                </button>
                <button class="drafts-mode-btn" id="btnDraftLocal"
                        onclick="setDraftSchedulerFilter('local',this)">
                    <i class="fas fa-tools" style="margin-right:5px;"></i> Local Scheduler
                </button>
            </div>
            <button class="btn-drafts-viewall" id="btnDraftsViewAll"
                    onclick="viewAllDraftsReport()" style="display:none;">
                <i class="fas fa-external-link-alt"></i> VIEW ALL
            </button>
        </div>
    </div>

    <div id="draftsList">
        <div class="drafts-loading">
            <i class="fas fa-spinner fa-spin"></i> Loading drafts&hellip;
        </div>
    </div>

</div>

<!-- Delete confirmation modal -->
<div class="dc-modal-overlay" id="deleteModal">
    <div class="dc-modal">
        <div class="dc-modal-icon"><i class="fas fa-trash-alt"></i></div>
        <div class="dc-modal-title">Delete Draft?</div>
        <div class="dc-modal-body" id="deleteModalBody">
            This will permanently remove the draft. This action cannot be undone.
        </div>
        <div class="dc-modal-actions">
            <button class="btn-modal-cancel" onclick="closeDcModal()">Cancel</button>
            <button class="btn-modal-confirm-delete" id="confirmDeleteBtn">
                <i class="fas fa-trash-alt"></i> Delete
            </button>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/ACAD HEAD/drafts.acad.js') }}"></script>
{% endblock %}
