<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='landing/assets/logo.png') }}">
    <title>{{ title or 'Access Denied' }} - PUP Lopez</title>
    <link href="{{ url_for('static', filename='css/fonts.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
               background: #f6f1f1; color: #333; }
        .card { background: #fff; border-radius: 14px; max-width: 440px; width: 100%; padding: 32px 28px 28px;
                text-align: center; box-shadow: 0 16px 40px rgba(0, 0, 0, .12); border-top: 5px solid #800000; }
        .icon { width: 58px; height: 58px; border-radius: 50%; background: #fbe4e4; color: #800000;
                display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin: 0 auto 14px; }
        h1 { color: #4b0a0a; font-size: 1.25rem; font-weight: 800; margin-bottom: 8px; }
        p { color: #666; font-size: .9rem; line-height: 1.55; margin-bottom: 22px; }
        .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 22px; border-radius: 8px;
               background: #800000; color: #fff; font-weight: 700; font-size: .86rem; text-decoration: none;
               border: 2px solid #800000; cursor: pointer; }
        .btn:hover { background: #5c0000; }
        .btn.ghost { background: #fff; color: #800000; }
    </style>
</head>
<body>
    <main class="card" role="alert">
        <div class="icon"><i class="fas {{ icon or 'fa-lock' }}" aria-hidden="true"></i></div>
        <h1>{{ title or 'Access Denied' }}</h1>
        <p>{{ message or "Your account doesn't have permission to open this page. If you think this is a mistake, please contact the Administrator." }}</p>
        <div class="actions">
            {% if show_reload %}
            <a class="btn ghost" href="{{ home_url }}" onclick="if (history.length > 1) { history.back(); return false; }">
                <i class="fas fa-arrow-left" aria-hidden="true"></i> Go back</a>
            {% endif %}
            <a class="btn" href="{{ home_url }}"><i class="fas fa-house" aria-hidden="true"></i> {{ home_label or 'Go to my dashboard' }}</a>
        </div>
    </main>
</body>
</html>
